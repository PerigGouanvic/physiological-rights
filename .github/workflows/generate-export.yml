name: Generate content export

on:
  push:
    branches: [main]
    paths:
      - '_rights/**'
      - '_definitions/**'
      - '_critique/**'
      - '_editorials/**'
      - '_reports/**'
      - '_resources/**'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate export
        run: python3 scripts/generate_export.py

      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/index.txt
          if git diff --cached --quiet; then
            echo "No changes to export."
          else
            git commit -m "chore: regenerate content export [skip ci]"
            git push
          fi
